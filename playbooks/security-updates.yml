---
- name: Apply security updates
  hosts: all
  become: true
  serial: "50%"
  vars:
    security_reboot: false
    security_reboot_time: "03:00"
    
  tasks:
    - name: Check for security updates (Debian/Ubuntu)
      apt:
        update_cache: yes
        upgrade: safe
        cache_valid_time: 3600
        autoremove: yes
        autoclean: yes
      register: apt_updates
      when: ansible_os_family == "Debian"
    
    - name: Check for security updates (RHEL/CentOS)
      yum:
        name: '*'
        security: yes
        state: latest
        update_cache: yes
      register: yum_updates
      when: ansible_os_family == "RedHat"
    
    - name: Display available updates (Debian)
      debug:
        msg: "Security updates available: {{ apt_updates.stdout_lines }}"
      when: ansible_os_family == "Debian" and apt_updates.changed
    
    - name: Display available updates (RHEL)
      debug:
        msg: "Security updates available: {{ yum_updates.results | map(attribute='name') | list }}"
      when: ansible_os_family == "RedHat" and yum_updates.changed
    
    - name: Check if reboot required (Debian)
      stat:
        path: /var/run/reboot-required
      register: reboot_required_debian
      when: ansible_os_family == "Debian"
    
    - name: Check if reboot required (RHEL)
      command: needs-restarting -r
      register: reboot_required_rhel
      changed_when: false
      ignore_errors: true
      when: ansible_os_family == "RedHat"
    
    - name: Schedule reboot if needed
      command: shutdown -r {{ security_reboot_time }}
      when: 
        - security_reboot | default(false)
        - (ansible_os_family == "Debian" and reboot_required_debian.stat.exists) or 
          (ansible_os_family == "RedHat" and reboot_required_rhel.rc != 0)
    
    - name: Create update report
      copy:
        content: |
          Security Update Report
          ======================
          Host: {{ inventory_hostname }}
          Date: {{ ansible_date_time.iso8601 }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          
          {% if ansible_os_family == "Debian" %}
          Updates applied: {{ apt_updates.changed | default(false) }}
          {% if apt_updates.changed %}
          Packages updated:
            {% for line in apt_updates.stdout_lines %}
            - {{ line }}
            {% endfor %}
          {% endif %}
          Reboot required: {{ reboot_required_debian.stat.exists | default(false) }}
          {% endif %}
          
          {% if ansible_os_family == "RedHat" %}
          Updates applied: {{ yum_updates.changed | default(false) }}
          {% if yum_updates.changed %}
          Packages updated:
            {% for package in yum_updates.results %}
            - {{ package.name }} ({{ package.from_version }} -> {{ package.to_version }})
            {% endfor %}
          {% endif %}
          Reboot required: {{ reboot_required_rhel.rc != 0 | default(false) }}
          {% endif %}
          
          Reboot scheduled: {{ security_reboot | default(false) and ((ansible_os_family == "Debian" and reboot_required_debian.stat.exists) or (ansible_os_family == "RedHat" and reboot_required_rhel.rc != 0)) }}
        dest: /var/log/security-updates-{{ ansible_date_time.date }}.log
        mode: '0644'
