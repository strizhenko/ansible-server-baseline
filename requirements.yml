---
# Ansible Galaxy role dependencies

# Collections
collections:
  - name: community.docker
    version: "3.0.0"
  - name: ansible.posix
    version: "1.4.0"
  - name: community.general
    version: "6.0.0"

# Roles
roles:
  - name: geerlingguy.pip
    version: "2.0.0"
  
  - name: geerlingguy.ntp
    version: "2.0.0"
    when: "'ntp' in monitoring_collectors"
  
  - name: geerlingguy.certbot
    version: "5.0.0"
    when: certbot_enabled | default(false)
